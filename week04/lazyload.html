<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lazy Loading Images</title>
  <meta name="description" content="Demonstration of native browser lazy loading for images - WDD 131">
  <meta name="author" content="Chineme Ndu-Okoronkwo">
  <link rel="stylesheet" href="styles/lazyload.css">
  <script src="scripts/lazyload.js" defer></script>
</head>
<body>
  <main>
    <h1>Lazy Loading Image Gallery</h1>

    <img src="https://picsum.photos/id/1015/400/600" alt="Mountain river landscape" width="400" height="600" loading="lazy">
    <img src="https://picsum.photos/id/1016/400/600" alt="Rocky mountain range" width="400" height="600" loading="lazy">
    <img src="https://picsum.photos/id/1018/400/600" alt="Forest and lake view" width="400" height="600" loading="lazy">
    <img src="https://picsum.photos/id/1021/400/600" alt="Canyon landscape" width="400" height="600" loading="lazy">
    <img src="https://picsum.photos/id/1024/400/600" alt="Dog portrait outdoors" width="400" height="600" loading="lazy">
    <img src="https://picsum.photos/id/1035/400/600" alt="Snowy mountain peak" width="400" height="600" loading="lazy">
  </main>

  <footer>
    <p>&copy; 2026 Chineme Ndu-Okoronkwo, WDD131</p>
    <p>Last Modified: <span id="lastModified"></span></p>
  </footer>
</body>
</html>
